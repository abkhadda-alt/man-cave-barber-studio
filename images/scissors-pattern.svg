<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!-- One scissors icon, drawn pointing up; placed twice per tile (staggered) so the repeat reads as diagonal rows -->
  <defs>
    <g id="s" fill="none" stroke="#2f3022" stroke-linecap="round">
      <path d="M -7 7 L 5 -24" stroke-width="3.6"/>
      <path d="M 7 7 L -5 -24" stroke-width="3.6"/>
      <circle cx="-9.5" cy="13" r="5.2" stroke-width="3"/>
      <circle cx="9.5" cy="13" r="5.2" stroke-width="3"/>
      <circle cx="0" cy="-1.5" r="1.4" fill="#2f3022" stroke="none"/>
    </g>
  </defs>
  <use href="#s" transform="translate(45 50) rotate(-32)"/>
  <use href="#s" transform="translate(135 140) rotate(-32)"/>
</svg>
